name: Smava
description: 'Smava (smava GmbH) is a Berlin-based German consumer-finance marketplace, founded in 2007, that
  lets borrowers compare personal, auto, and mortgage loan offers from more than 20 partner banks for amounts
  ranging from EUR 1,000 to EUR 120,000, without impacting their SCHUFA credit score. The company operates a
  digital, data-driven loan-brokerage platform serving consumers across Germany and employs roughly 600 people.
  It was added to the API Evangelist network as a portfolio company of Earlybird. As of this enrichment pass
  Smava is a consumer (B2C) web and mobile-app business and publishes no public developer API, developer portal,
  OpenAPI specification, or well-known API discovery endpoints.'
